name: CI Build (qmake + make)

on:
  push: {}
  pull_request:
    branches: [main]

jobs:
  build-ubuntu-22_04:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Ubuntu) 
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qtbase5-dev qt5-qmake qtchooser make g++ libqt5websockets5-dev libfftw3-dev
      - name: Build project
        shell: bash
        run: |
          qmake -version
          qmake
          make
      - name: Start program (Linux)
        run: |
          if [ -f ./bin/debug/vu_backend ]; then
            timeout 10s sudo ./bin/debug/vu_backend > output.log 2>&1 &
            echo $! > pid.txt
          elif [ -f ./bin/release/vu_backend ]; then
            timeout 10s sudo ./bin/release/vu_backend > output.log 2>&1 &
            echo $! > pid.txt
          else
            echo "Executable not found!" && exit 1
          fi
      - name: Keep program running (Linux)
        run: |
          sleep 10
      - name: Stop program and check output (Linux)
        run: |
          kill $(cat pid.txt) || true
          cat output.log
          grep -q "▐▀▄▀▌ Загружена версия протокола: 2 . 2" output.log

  build-windows-latest:
    runs-on: windows-latest
    env:
      BUILD_TYPE: release
    steps:
      - uses: actions/checkout@v4
      - name: Установка Qt
        run: |
          choco install qt5-default -y --params "/InstallDir:C:\Qt"
      - name: Настройка среды Qt
        run: |
          echo "QT_DIR=C:\Qt\5.15.2\mingw81_64" >> $env:GITHUB_ENV
          echo "C:\Qt\5.15.2\mingw81_64\bin" >> $env:GITHUB_PATH
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" >> $env:GITHUB_PATH
          echo "QMAKESPEC=win32-g++" >> $env:GITHUB_ENV
      - name: Build project
        shell: cmd
        working-directory: ${{ github.workspace }}
        run: |
          qmake -version
          qmake
          mingw32-make

      - name: Run application with 10s timeout, no logs
        shell: pwsh
        working-directory: ${{ github.workspace }}\bin\${{ env.BUILD_TYPE }}
        run: |
          $p = Start-Process -FilePath "./vu_backend.exe" -NoNewWindow -PassThru
          Start-Sleep -Seconds 10
          if (-not $p.HasExited) {
            Write-Host "Timeout reached, killing vu_backend.exe"
            $p.Kill()
          }
        
