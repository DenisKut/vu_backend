services:
  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_USER: nikit
      POSTGRES_PASSWORD: admin000
      POSTGRES_DB: vu_backend
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - backend_network

  adminer:
    image: adminer:latest
    container_name: adminer
    ports:
      - "5431:8080"
    depends_on:
      - postgres
    networks:
      - backend_network

volumes:
  pgdata:

networks:
  backend_network:
    driver: bridge