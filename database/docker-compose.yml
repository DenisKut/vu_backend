version: '3.9'

services:
  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_USER: postgres # Имя пользователя для БД
      POSTGRES_PASSWORD: password # Пароль пользователя
      POSTGRES_DB: vu_backend # Имя создаваемой БД
    volumes:
      - pgdata:/var/lib/postgresql/data # Том для хранения данных БД
    ports:
      - '5430:5432' # Проброс порта PostgreSQL
    networks:
      - backend_network # Внутренняя сеть для сервисов

  adminer:
    image: adminer:latest
    container_name: adminer
    ports:
      - '5431:8080' # Проброс порта для веб-интерфейса Adminer
    depends_on:
      - postgres # Запускать после postgres
    networks:
      - backend_network

volumes:
  pgdata: # Определение тома для БД

networks:
  backend_network: # Определение внутренней сети
    driver: bridge
