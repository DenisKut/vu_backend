# Конфигурация сборки и запуска проектов
# Формат: ключ=значение
[env]
# Пути к Qt и MinGW (или gcc/g++ для Linux)
# (если не тот — будет попытка автопоиска)
qt_path = D:/Progs/Qt/5.15.2/mingw81_64/bin/qmake.exe
# Путь к make (или mingw32-make для Windows)
mingw_path = D:/Progs/Qt/Tools/mingw810_64/bin/mingw32-make.exe
make_args = -j12
# Список проектов через запятую
projects = vu_backend, vu_rmo
# Флаги пересборки (0 — не пересобирать, 1 — всегда пересобирать)
force_rebuild_backend = 1
force_rebuild_rmo = 1
# Для каждого проекта:
#   - path: относительный путь к папке с .pro
#   - pro: имя .pro-файла
#   - exe: относительный путь к .exe после сборки
#   - qmake_args: дополнительные параметры для qmake (опционально)
#   - make_args: дополнительные параметры для make (например, -j4)
[vu_backend]
path = vu_backend
pro = vu_backend.pro
exe = vu_backend/bin/${qmake_config}/vu_backend.exe
qmake_args = 
qmake_config = debug traice
[vu_rmo]
path = vu_rmo
pro = vu_rmo.pro
exe = vu_rmo/build/${qmake_config}/vu_rmo.exe
qmake_args =
qmake_config = release
